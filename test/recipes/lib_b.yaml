depends:
  - lib_a

checkoutSCM:
    scm: import
    url: ../src/lib_b/
    recipeRelative: True

buildScript: |
  # $1 = checkout, $2..$n = dependencies
  SRCDIR="$1"

  # Shift argument to remove $1 from the list
  shift

  # Concatenate all dependencies
  DEPS=""
  for dep in "$@"; do
    DEPS="${DEPS:+$DEPS;}${dep}"
  done

  echo "DEPS:" $DEPS

  cmake -S "$SRCDIR" -B . \
    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
    -DCMAKE_PREFIX_PATH="$DEPS"

  cmake --build . --parallel

packageScript: |
    cmake --install $1 --prefix .
